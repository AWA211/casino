<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROYAL CRYPTO CASINO — 185+ Slots & Live Games</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #07080f;
            --bg-sec: #0e101d;
            --bg-card: #15182b;
            --bg-glass: rgba(21, 24, 43, 0.88);
            --accent: #f5b041;
            --accent-2: #00e676;
            --neon-purple: #9b59b6;
            --neon-blue: #00d2ff;
            --danger: #ff4757;
            --text: #ffffff;
            --text-muted: #8b92b2;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 50% 0%, #1a153a 0%, #07080f 65%);
            color: var(--text);
            padding-bottom: 85px;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Верхняя лента заносов (Live Wins Ticker) */
        .live-ticker {
            background: #05060b;
            border-bottom: 1px solid var(--border);
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            font-size: 11px;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background: var(--accent-2);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-2);
            flex-shrink: 0;
        }

        .ticker-track {
            display: flex;
            gap: 18px;
            white-space: nowrap;
            animation: tickerMove 28s linear infinite;
        }

        @keyframes tickerMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .ticker-item span {
            color: var(--accent-2);
            font-weight: 700;
        }

        /* Шапка */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 13, 24, 0.92);
            backdrop-filter: blur(16px);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: linear-gradient(135deg, #f5b041, #e67e22);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 0 15px rgba(245, 176, 65, 0.4);
        }

        .logo-text {
            font-size: 17px;
            font-weight: 900;
            letter-spacing: 0.6px;
            background: linear-gradient(90deg, #fff, #f5b041);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .balance-pill {
            display: flex;
            align-items: center;
            background: #0c0e1a;
            border: 1px solid rgba(245, 176, 65, 0.35);
            border-radius: 12px;
            padding: 4px 5px 4px 12px;
            gap: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.6);
        }

        .balance-val {
            font-weight: 800;
            font-size: 14px;
            color: var(--accent);
        }

        .btn-plus {
            background: linear-gradient(135deg, #00e676, #00b862);
            color: #000;
            border: none;
            border-radius: 8px;
            width: 28px;
            height: 28px;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 10px rgba(0, 230, 118, 0.35);
        }

        .container {
            padding: 14px;
            max-width: 640px;
            margin: 0 auto;
        }

        /* Вкладки секций */
        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Промо-карусель баннеров */
        .hero-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .hero-card {
            border-radius: 16px;
            padding: 14px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.12);
            min-height: 112px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hero-card.lebandit {
            background: linear-gradient(135deg, #4b2c20 0%, #c0392b 50%, #f39c12 100%);
        }

        .hero-card.fith {
            background: linear-gradient(135deg, #1e272e 0%, #d35400 55%, #f1c40f 100%);
        }

        .hero-tag {
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            background: rgba(0,0,0,0.55);
            padding: 3px 7px;
            border-radius: 6px;
            width: fit-content;
            color: #ffdd59;
        }

        .hero-title {
            font-size: 15px;
            font-weight: 900;
            line-height: 1.15;
            margin-top: 6px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }

        .hero-sub {
            font-size: 11px;
            opacity: 0.9;
            margin-top: 2px;
        }

        .hero-art {
            position: absolute;
            right: -6px;
            bottom: -8px;
            font-size: 52px;
            opacity: 0.35;
            transform: rotate(-12deg);
            pointer-events: none;
        }

        /* Быстрые кнопки провайдеров */
        .provider-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .prov-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 10px 6px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .prov-btn span.p-icon {
            font-size: 16px;
        }

        .prov-btn.active {
            background: linear-gradient(180deg, rgba(245,176,65,0.2), rgba(245,176,65,0.05));
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px rgba(245,176,65,0.18);
        }

        /* Поиск и категории */
        .sticky-controls {
            position: sticky;
            top: 57px;
            z-index: 90;
            background: rgba(7, 8, 15, 0.94);
            backdrop-filter: blur(10px);
            padding: 8px 0;
        }

        .search-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .search-box {
            position: relative;
            flex: 1;
        }

        .search-box input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: #fff;
            padding: 11px 34px 11px 36px;
            border-radius: 12px;
            font-size: 13px;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .search-ico {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: var(--text-muted);
        }

        .clear-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn-dice {
            background: linear-gradient(135deg, #8e44ad, #5f27cd);
            border: none;
            color: #fff;
            padding: 0 14px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
        }

        .cat-scroll {
            display: flex;
            gap: 7px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .cat-scroll::-webkit-scrollbar { display: none; }

        .cat-pill {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
        }

        .cat-pill.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .catalog-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
        }

        .catalog-title {
            font-size: 15px;
            font-weight: 800;
        }

        .catalog-count {
            font-size: 11px;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 4px 9px;
            border-radius: 8px;
        }

        /* СЕТКА СЛОТОВ С ГРАФИЧЕСКИМИ ПОСТЕРАМИ */
        .slots-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .slot-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            position: relative;
        }

        .slot-card:active {
            transform: scale(0.96);
        }

        /* Красивое превью-постер слота */
        .slot-poster {
            height: 138px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px;
        }

        /* Декоративная сетка и свечение внутри постера */
        .poster-pattern {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle at 50% 32%, rgba(255,255,255,0.28) 0%, transparent 60%),
                repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
        }

        .poster-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }

        .prov-tag {
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            padding: 3px 7px;
            border-radius: 6px;
            letter-spacing: 0.4px;
            backdrop-filter: blur(6px);
        }
        .prov-pragmatic { background: rgba(245, 176, 65, 0.9); color: #000; }
        .prov-hacksaw { background: rgba(0, 230, 118, 0.9); color: #000; }
        .prov-nolimit { background: rgba(255, 71, 87, 0.95); color: #fff; }

        .fav-btn {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.15);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
        }

        /* Центральная иллюстрация и лого-плашка на постере */
        .poster-center {
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 2px;
        }

        .poster-emblem {
            width: 54px;
            height: 54px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.35);
            border: 1.5px solid rgba(255, 255, 255, 0.28);
            box-shadow: 0 6px 18px rgba(0,0,0,0.45), inset 0 0 12px rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            backdrop-filter: blur(4px);
        }

        .poster-logo-banner {
            z-index: 2;
            background: linear-gradient(180deg, rgba(10,12,22,0.55) 0%, rgba(10,12,22,0.92) 100%);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 10px;
            padding: 5px 6px;
            text-align: center;
            backdrop-filter: blur(6px);
        }

        .poster-logo-text {
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.9);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .slot-footer {
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111324;
            font-size: 11px;
        }

        .rtp-pill {
            color: var(--text-muted);
            font-weight: 600;
        }

        .maxwin-pill {
            color: var(--accent-2);
            font-weight: 800;
            background: rgba(0, 230, 118, 0.1);
            padding: 2px 6px;
            border-radius: 5px;
        }

        /* ================= РУЛЕТКА (ROULETTE) ================= */
        .game-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .roulette-wheel-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px 0 16px;
            position: relative;
        }

        .wheel-outer {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            border: 6px solid var(--accent);
            background: conic-gradient(
                #00b862 0deg 9.7deg,
                #e74c3c 9.7deg 19.4deg, #1e272e 19.4deg 29.1deg,
                #e74c3c 29.1deg 38.9deg, #1e272e 38.9deg 48.6deg,
                #e74c3c 48.6deg 58.3deg, #1e272e 58.3deg 68.1deg,
                #e74c3c 68.1deg 77.8deg, #1e272e 77.8deg 87.5deg,
                #e74c3c 87.5deg 97.2deg, #1e272e 97.2deg 107deg,
                #e74c3c 107deg 116.7deg, #1e272e 116.7deg 126.4deg,
                #e74c3c 126.4deg 136.2deg, #1e272e 136.2deg 145.9deg,
                #e74c3c 145.9deg 155.6deg, #1e272e 155.6deg 165.4deg,
                #e74c3c 165.4deg 175.1deg, #1e272e 175.1deg 184.8deg,
                #e74c3c 184.8deg 194.5deg, #1e272e 194.5deg 204.3deg,
                #e74c3c 204.3deg 214deg, #1e272e 214deg 223.7deg,
                #e74c3c 223.7deg 233.5deg, #1e272e 233.5deg 243.2deg,
                #e74c3c 243.2deg 252.9deg, #1e272e 252.9deg 262.7deg,
                #e74c3c 262.7deg 272.4deg, #1e272e 272.4deg 282.1deg,
                #e74c3c 282.1deg 291.8deg, #1e272e 291.8deg 301.6deg,
                #e74c3c 301.6deg 311.3deg, #1e272e 311.3deg 321deg,
                #e74c3c 321deg 330.8deg, #1e272e 330.8deg 340.5deg,
                #e74c3c 340.5deg 350.2deg, #1e272e 350.2deg 360deg
            );
            box-shadow: 0 0 30px rgba(245, 176, 65, 0.25), inset 0 0 20px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 3s cubic-bezier(0.15, 0.85, 0.25, 1);
        }

        .wheel-center {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: #0c0e1a;
            border: 3px solid rgba(255,255,255,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 28px;
            z-index: 4;
            position: absolute;
            top: 47px;
        }

        .roulette-history {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            margin-bottom: 12px;
            padding-bottom: 4px;
        }

        .r-hist-ball {
            min-width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
        }

        .r-red { background: #e74c3c; color: #fff; }
        .r-black { background: #2d3436; color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .r-green { background: #00b862; color: #000; }

        .bet-board-outside {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .r-bet-btn {
            background: #1d213a;
            border: 1.5px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 11px 6px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
        }

        .r-bet-btn.selected {
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(245, 176, 65, 0.45);
            transform: translateY(-1px);
        }

        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
            margin-bottom: 14px;
            max-height: 175px;
            overflow-y: auto;
            padding: 4px;
            background: #0b0d18;
            border-radius: 12px;
        }

        .num-cell {
            padding: 8px 0;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 800;
            text-align: center;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .num-cell.selected {
            border-color: #fff;
            box-shadow: 0 0 8px #fff;
        }

        .chips-row {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            overflow-x: auto;
        }

        .chip-btn {
            flex: 1;
            background: #1d213a;
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 8px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
        }
        .chip-btn.active {
            background: var(--accent);
            color: #000;
        }

        /* ================= БЛЭКДЖЕК 21 (BLACKJACK) ================= */
        .bj-table {
            background: radial-gradient(circle at 50% 30%, #144932 0%, #0a291c 80%);
            border: 3px solid #c89d54;
            border-radius: 20px;
            padding: 18px 14px;
            min-height: 310px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 0 0 35px rgba(0,0,0,0.7);
            margin-bottom: 14px;
        }

        .bj-hand-Zone {
            text-align: center;
        }

        .bj-label {
            font-size: 12px;
            font-weight: 700;
            color: rgba(255,255,255,0.8);
            margin-bottom: 8px;
            display: inline-block;
            background: rgba(0,0,0,0.45);
            padding: 4px 12px;
            border-radius: 12px;
        }

        .bj-cards {
            display: flex;
            justify-content: center;
            gap: 8px;
            min-height: 86px;
            flex-wrap: wrap;
        }

        .playing-card {
            width: 58px;
            height: 84px;
            background: #ffffff;
            border-radius: 8px;
            color: #111;
            padding: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-weight: 900;
            box-shadow: 0 6px 14px rgba(0,0,0,0.5);
            animation: cardDeal 0.2s ease;
        }

        @keyframes cardDeal {
            from { transform: translateY(-20px) scale(0.8); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .playing-card.red { color: #d63031; }
        .playing-card.hidden {
            background: repeating-linear-gradient(135deg, #c0392b, #c0392b 8px, #962d22 8px, #962d22 16px);
            border: 2px solid #fff;
            color: transparent;
        }

        .card-suit-center {
            font-size: 24px;
            text-align: center;
        }

        .bj-status {
            text-align: center;
            font-size: 16px;
            font-weight: 900;
            color: #ffdd59;
            min-height: 24px;
            margin: 10px 0;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
        }

        .bj-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .btn-action {
            padding: 13px;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-gold {
            background: linear-gradient(90deg, #f5b041, #f39c12);
            color: #000;
            box-shadow: 0 4px 15px rgba(245, 176, 65, 0.35);
        }

        .btn-green {
            background: linear-gradient(90deg, #00e676, #00b862);
            color: #000;
        }

        .btn-red {
            background: var(--danger);
            color: #fff;
        }

        .btn-blue {
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: #fff;
        }

        /* ================= МОДАЛЬНОЕ ОКНО СЛОТА (СВЫБОРОМ РЕЖИМА!) ================= */
        .game-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: #05060b;
            z-index: 300;
            flex-direction: column;
        }
        .game-modal.active { display: flex; }

        .game-modal-top {
            background: #101324;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .mode-switcher {
            display: flex;
            background: #080a12;
            padding: 4px;
            gap: 6px;
