        }

        .clear-search {

            right: 10px;

            border: none;
            color: #fff;
            width: 20px;
            height: 20px;

            cursor: pointer;

            align-items: center;

            const val = parseInt(document.getElementById('topupInput').value);
            if (val && val > 0) {
                balance += val;
                updateUI();
                closeTopUp();
            }
        }

        // Логика встроенного слота Royal 777
        const symbols = ['🍒', '🍋', '🔔', '💎', '7️⃣', '👑'];
        function changeBet(delta) {
            if (currentBet + delta >= 100) {
                currentBet += delta;
                updateUI();
            }
        }

        function spinCustomSlot() {
            if (isSpinning) return;
            if (balance < currentBet) {
                openTopUp();
                return;
            }

            isSpinning = true;
            balance -= currentBet;
            updateUI();
            document.getElementById('winMessage').innerText = '';

            const r1 = document.getElementById('reel1');
            const r2 = document.getElementById('reel2');
            const r3 = document.getElementById('reel3');

            let ticks = 0;
            const interval = setInterval(() => {
                r1.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                r2.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                r3.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                ticks++;

                if (ticks > 12) {
                    clearInterval(interval);
                    let win = 0;
                    if (r1.innerText === r2.innerText && r2.innerText === r3.innerText) {
                        win = currentBet * 12;
                    } else if (r1.innerText === r2.innerText || r2.innerText === r3.innerText || r1.innerText === r3.innerText) {
                        win = currentBet * 2;
                    }
                    if (win > 0) {
                        balance += win;
                        updateUI();
                        document.getElementById('winMessage').innerText = `🎉 ВЫИГРЫШ: +${win.toLocaleString('ru-RU')} ₽!`;
                    }
                    isSpinning = false;
                }
            }, 65);
        }

        // Старт
        updateUI();
        renderSlots();
    </script>
</body>
</html>
